<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KELLY 詩詞書畫</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  <!-- 詳情頁內容：由 main.js 依網址 ?id= 渲染單一詩作 -->
  <main id="detail" class="wrapper"></main>

  <script>
    // 待 defer 的 main.js 載入完成後，再渲染詩作詳情
    document.addEventListener('DOMContentLoaded', () => {
      renderDetail().catch(err => {
        console.error('載入詩作詳情失敗：', err);
        // file:// 直接開啟時 CORS 會擋下 fetch，將可讀提示寫入詳情區
        document.getElementById('detail').innerHTML =
          '詩作資料載入失敗。<br>請在專案資料夾執行 <code>python -m http.server 8000</code>，再用瀏覽器開啟 <code>http://127.0.0.1:8000/poem.html</code>。';
      });
    });
  </script>
</body>
</html>
